server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # O console é uma SPA: qualquer rota desconhecida devolve o index e o
  # react-router resolve do lado do cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O front chama /api e /health como caminhos relativos; o nginx encaminha
  # para o serviço da API na rede do Compose. Sem CORS, sem URL no bundle.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
  }

  location /docs {
    proxy_pass http://api:8000/docs;
    proxy_set_header Host $host;
  }

  location /openapi.json {
    proxy_pass http://api:8000/openapi.json;
    proxy_set_header Host $host;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
