[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# A cobertura roda por padrão e reprova abaixo de 70%: um limiar que só é
# verificado quando alguém lembra de passar a flag não é um limiar.
addopts =
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-fail-under=70

filterwarnings =
    ignore::DeprecationWarning
